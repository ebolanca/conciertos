version: '3.8'

services:
  madrid-concert-notifier:
    build: .
    container_name: madrid-concert-notifier
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - TZ=Europe/Madrid
    volumes:
      # Carpeta de datos persistentes (artistas, conciertos y calendario .ics)
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
      - ./templates:/app/templates
      - ./concert_finder.py:/app/concert_finder.py
      - ./main.py:/app/main.py
      - ./artist_scanner.py:/app/artist_scanner.py
      - ./whatsapp_service.py:/app/whatsapp_service.py
      - ./gcalendar_service.py:/app/gcalendar_service.py
      
      # Montaje de la carpeta de musica de tu servidor OMEN
      - "D:/media-library/music:/media:ro"

      # Montaje del cache sincronizado de Spotify (spotdl-sync)
      - "D:/Docker/media-server/spotdl-sync/cache:/app/spotdl_cache:ro"
